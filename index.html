<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Sheet — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="firebase-sync.js"></script>
<style>
:root{--bg:#0b0d13;--surface:#141824;--s2:#1b2030;--s3:#242b3f;--border:#262c3d;--text:#e9ebf2;--dim:#8d93a8;--faint:#5c6379;--accent:#6c8cff;--accent2:#9b6cff;--soft:rgba(108,140,255,.14);--amber:#ffb454;--danger:#ff6b6b;--success:#4ade80}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 400px at 15% -10%,rgba(108,140,255,.12),transparent),radial-gradient(700px 360px at 95% 0,rgba(155,108,255,.10),transparent),var(--bg);background-attachment:fixed;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px}
#loadingScreen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s,visibility .5s}
#loadingScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
.load-mark{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:800 26px Syne;color:#0b0d13;animation:pm 1.6s infinite}
@keyframes pm{50%{box-shadow:0 0 0 14px rgba(108,140,255,0);transform:scale(1.05)}}
.load-bar{width:200px;height:3px;background:var(--s2);border-radius:2px;overflow:hidden}.load-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .18s}
.load-sub{font:11px 'DM Mono';color:var(--faint);letter-spacing:.6px}
/* nav */
.topnav{display:flex;align-items:center;gap:18px;padding:12px 32px;background:rgba(20,24,36,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.logo{font:800 18px Syne;display:flex;align-items:center;gap:9px}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:700 13px 'DM Mono';color:#0b0d13}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;transition:.15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.search input{background:none;border:0;color:var(--text);font-size:13px;width:100%;outline:0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:8px 15px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--s3)}.btn.primary{background:linear-gradient(135deg,var(--accent),#8a7bff);border:0;color:#0b0d13;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}.btn.icon{padding:8px}
.sync{font:10.5px 'DM Mono';color:var(--faint);padding:5px 10px;border-radius:20px;display:none;align-items:center;gap:5px}
.sync:not(:empty){display:flex}.sync::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.syncing{color:var(--amber);background:rgba(255,180,84,.1)}.sync.ok{color:var(--success);background:rgba(74,222,128,.1)}.sync.err{color:var(--danger);background:rgba(255,107,107,.1)}
.auth-area{display:flex;align-items:center;gap:10px}#signInBtn{line-height:0}
.chip{display:none;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:4px 6px 4px 4px}
.chip img{width:26px;height:26px;border-radius:50%;background:var(--s3)}.chip span{font-size:12px;font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip .btn{padding:5px 10px;font-size:11.5px}
/* main */
.main{max-width:1240px;margin:0 auto;padding:36px 32px 90px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.hero h1{font:800 28px Syne;margin:0 0 6px;letter-spacing:-.3px}.hero p{margin:0;color:var(--dim);font-size:14px}
.stats{display:flex;gap:12px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:108px}
.stat b{display:block;font:700 22px Syne}.stat span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.sec-title{font:700 15px Syne;margin:0}.sec-title .count{color:var(--faint);font:500 11.5px 'DM Mono'}
.chips{display:flex;gap:6px;flex-wrap:wrap}.cat{background:transparent;border:1px solid var(--border);color:var(--dim);padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;transition:.15s}
.cat:hover{color:var(--text)}.cat.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-bottom:46px}
.tpl{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s}
.tpl:hover{border-color:var(--tc);transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.thumb{height:106px;border-bottom:1px solid var(--border);position:relative;background:
 linear-gradient(var(--tc),var(--tc)) 12px 14px/38% 8px no-repeat,
 repeating-linear-gradient(0deg,transparent 0 12px,rgba(255,255,255,.06) 12px 13px) 12px 34px/calc(100% - 24px) 62px no-repeat,
 repeating-linear-gradient(90deg,transparent 0 44px,rgba(255,255,255,.06) 44px 45px) 12px 34px/calc(100% - 24px) 62px no-repeat,
 linear-gradient(160deg,color-mix(in srgb,var(--tc) 14%,var(--s2)),var(--surface))}
.thumb .tag{position:absolute;top:10px;right:10px;font:500 9.5px 'DM Mono';color:var(--tc);background:rgba(0,0,0,.35);padding:2px 7px;border-radius:10px}
.tpl .lbl{padding:11px 13px;font-size:13px;font-weight:600}.tpl .lbl small{display:block;font-size:11px;color:var(--faint);margin-top:2px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.grid.list{grid-template-columns:1fr;gap:8px}
.doc{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;transition:.18s;position:relative}
.doc:hover{border-color:var(--accent);transform:translateY(-2px)}
.doc .thumb{--tc:var(--accent);height:120px}
.doc-info{padding:11px 14px 13px}.doc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font:10.5px 'DM Mono';color:var(--faint);margin-top:4px}
.grid.list .doc{display:flex;align-items:center;border-radius:10px}.grid.list .thumb{width:84px;height:54px;border:0;border-right:1px solid var(--border);flex-shrink:0;background-size:30% 6px,calc(100% - 20px) 30px,calc(100% - 20px) 30px,100% 100%}
.grid.list .doc-info{flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 54px 0 16px}.grid.list .doc-meta{margin:0}
.cloud{position:absolute;bottom:8px;right:8px;width:22px;height:22px;border-radius:6px;background:rgba(11,13,19,.75);display:grid;place-items:center;color:var(--accent)}
.cloud svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.grid.list .cloud{bottom:auto;top:50%;right:48px;transform:translateY(-50%)}
.mbtn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:7px;background:rgba(11,13,19,.8);border:1px solid var(--border);display:none;place-items:center;color:var(--text);cursor:pointer}
.doc:hover .mbtn{display:grid}.mbtn svg{width:14px;height:14px;fill:currentColor}.grid.list .mbtn{top:50%;transform:translateY(-50%)}
.menu{position:absolute;top:38px;right:8px;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:5px;min-width:150px;box-shadow:0 14px 32px rgba(0,0,0,.5);z-index:60;display:none}
.menu.show{display:block}.mi{padding:8px 11px;font-size:12.5px;border-radius:6px;cursor:pointer}.mi:hover{background:var(--soft);color:var(--accent)}.mi.danger:hover{background:rgba(255,107,107,.12);color:var(--danger)}
.seg{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:9px;overflow:hidden}.seg button{background:none;border:0;color:var(--dim);padding:6px 10px;cursor:pointer}.seg button.on{background:var(--s3);color:var(--text)}.seg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;display:block}
select.sort{background:var(--s2);border:1px solid var(--border);color:var(--dim);padding:7px 10px;border-radius:9px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;border:1px dashed var(--border);border-radius:14px;color:var(--dim)}.empty h3{font:700 15px Syne;color:var(--text);margin:0 0 6px}.empty p{margin:0;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(6,7,10,.65);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}.overlay.show{display:flex}
.dialog{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:22px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dialog h3{margin:0 0 14px;font:700 15px Syne}.dialog input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s3);border:1px solid var(--border);padding:9px 16px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:600}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:700px){.topnav{padding:10px 14px;gap:10px}.main{padding:24px 14px 80px}.stats{display:none}.logo{font-size:0}}
</style>

</head>
<body>
<div id="loadingScreen"><div class="load-mark">P</div><div class="logo" style="font-size:19px">Pro Sheet</div><div class="load-bar"><i id="lbf"></i></div><div class="load-sub" id="lsub">LOADING WORKBOOKS…</div></div>

<div class="topnav">
  <div class="logo"><div class="mark">P</div>Pro Sheet</div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="searchInput" placeholder="Search your spreadsheets"></div>
  <div class="nav-right">
    <button class="btn primary" id="newBlankBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New spreadsheet</button>
    <button class="btn icon" id="syncNowBtn" title="Sync now" style="display:none"><svg viewBox="0 0 24 24"><path d="M21 2v6h-6M3 22v-6h6M3.5 8a8.5 8.5 0 0 1 14.9-3.5L21 8M20.5 16a8.5 8.5 0 0 1-14.9 3.5L3 16"/></svg></button>
    <div id="syncStatus" class="sync"></div>
    <div class="auth-area"><div id="signInBtn"></div>
      <div class="chip" id="userChip"><img id="userAvatar" src="" alt=""><span id="userName"></span><button class="btn" id="signOutBtn">Sign out</button></div></div>
  </div>
</div>

<div class="main">
  <div class="hero">
    <div><h1 id="greet">Welcome back</h1><p>Pick up where you left off, or start from a template.</p></div>
    <div class="stats"><div class="stat"><b id="stTotal">0</b><span>Spreadsheets</span></div><div class="stat"><b id="stWeek">0</b><span>Edited this week</span></div><div class="stat"><b id="stCloud">0</b><span>In cloud</span></div></div>
  </div>

  <div class="sec-head"><h2 class="sec-title">Start a new spreadsheet</h2><div class="chips" id="cats"></div></div>
  <div class="templates" id="templates"></div>

  <div class="sec-head"><h2 class="sec-title">Recent spreadsheets <span class="count" id="recentCount"></span></h2>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="sort" id="sortSel"><option value="updated">Last edited</option><option value="name">Name A–Z</option><option value="created">Date created</option></select>
      <div class="seg"><button id="vGrid" class="on" title="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button><button id="vList" title="List"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
    </div>
  </div>
  <div class="grid" id="recentGrid"></div>
</div>

<div class="overlay" id="dialogOverlay"><div class="dialog" id="dialogBox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const INDEX_KEY="prosheet_documents_index",DOC_PREFIX="prosheet_doc_",AUTH_KEY="prosheet_auth",VIEW_KEY="prosheet_dash_view";
const GOOGLE_CLIENT_ID="121904110568-hpr328e3opm544g78d57e49dk5gevgn7.apps.googleusercontent.com";
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbz9yx31d4-vTxy2Y8lIuJzELhS3h8Q4gLlihMkLiSfRY5P6OnF8Rnht91KngzW1sxml0g/exec";
const $=id=>document.getElementById(id);

/* loading */
let pct=0;const lt=setInterval(()=>{pct+=Math.random()*22+8;if(pct>=100){pct=100;clearInterval(lt);setTimeout(()=>$('loadingScreen').classList.add('hide'),220)}
$('lbf').style.width=pct+"%";$('lsub').textContent=["LOADING WORKBOOKS…","SYNCING RECENT FILES…","READY"][Math.min(2,Math.floor(pct/34))]},160);

/* helpers */
const uid=()=>'d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const loadIndex=()=>{try{return JSON.parse(localStorage.getItem(INDEX_KEY))||[]}catch(e){return[]}};
const saveIndex=l=>localStorage.setItem(INDEX_KEY,JSON.stringify(l));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function relTime(ts){const d=Date.now()-ts,m=Math.floor(d/6e4),h=Math.floor(d/36e5),dd=Math.floor(d/864e5);
 if(m<1)return"Just now";if(m<60)return`Edited ${m}m ago`;if(h<24)return`Edited ${h}h ago`;if(dd<7)return`Edited ${dd}d ago`;return"Edited "+new Date(ts).toLocaleDateString()}
const skeleton=()=>({data:{},colWidths:{},rowHeights:{},rows:100,merges:[],frozenRow:0,frozenCol:0});
const L=c=>String.fromCharCode(65+c);

/* ===== AUTH ===== */
let auth=null;
function loadAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY));if(a&&a.exp&&a.exp*1e3>Date.now())return a}catch(e){}return null}
function decodeJwt(t){try{return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')))}catch(e){return null}}
function onCred(resp){const p=decodeJwt(resp.credential);if(!p)return;auth={idToken:resp.credential,email:p.email,name:p.name,picture:p.picture,exp:p.exp};
 localStorage.setItem(AUTH_KEY,JSON.stringify(auth));renderAuth();syncFlow()}
function initAuth(){auth=loadAuth();renderAuth();
 if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(initAuth,150);return}
 google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onCred,auto_select:false});
 if(!auth)google.accounts.id.renderButton($('signInBtn'),{theme:'filled_black',size:'medium',shape:'pill',text:'signin_with'});else syncFlow()}
function renderAuth(){const on=!!auth;$('userChip').style.display=on?'flex':'none';$('signInBtn').style.display=on?'none':'block';$('syncNowBtn').style.display=on?'inline-flex':'none';
 if(on){$('userAvatar').src=auth.picture||'';$('userName').textContent=auth.name||auth.email||''}else setSync('','');
 $('greet').textContent=(()=>{const h=new Date().getHours();return(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+(auth&&auth.name?', '+auth.name.split(' ')[0]:'')})()}
$('signOutBtn').onclick=()=>{localStorage.removeItem(AUTH_KEY);auth=null;renderAuth();if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();renderRecent();toast("Signed out")};
$('syncNowBtn').onclick=()=>syncFlow();
function setSync(s,t){const e=$('syncStatus');e.className='sync '+(s||'');e.textContent=t||''}
const backendOn=()=>APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;
function syncFlow(){if(!auth)return;setSync('syncing','Syncing…');fullSync().then(()=>setSync('ok','Synced')).catch(e=>{setSync('err',backendOn()?'Sync failed':'Backend not set up');console.warn(e.message)})}

/* ===== BACKEND ===== */
async function call(action,data){
 if(!backendOn())throw new Error('Backend URL not configured');if(!auth)throw new Error('Not signed in');
 const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,idToken:auth.idToken,data:data||{}})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Backend error');return j.result}
async function fullSync(){
 const cloud=await call('list',{}),local=loadIndex(),by={};local.forEach(d=>by[d.id]=d);
 cloud.forEach(cd=>{const ld=by[cd.id];if(!ld)local.push({id:cd.id,name:cd.name,createdAt:cd.createdAt,updatedAt:cd.updatedAt,cloud:true});
  else{ld.cloud=true;if(cd.updatedAt>ld.updatedAt){ld.name=cd.name;ld.updatedAt=cd.updatedAt}}});
 saveIndex(local);renderRecent()}
async function pushDoc(id,name,c,u){if(!auth||!backendOn())return;
 try{setSync('syncing','Syncing…');await call('save',{id,name,createdAt:c,updatedAt:u,json:localStorage.getItem(DOC_PREFIX+id)||''});setSync('ok','Synced')}
 catch(e){setSync('err','Sync failed');console.warn(e.message)}}
async function delCloud(id){if(!auth||!backendOn())return;try{await call('delete',{id})}catch(e){console.warn(e.message)}}
async function ensureDoc(id){
 if(localStorage.getItem(DOC_PREFIX+id))return true;if(!auth||!backendOn())return false;
 try{setSync('syncing','Downloading…');const r=await call('get',{id});
  if(r&&typeof r.json==='string'&&r.json){localStorage.setItem(DOC_PREFIX+id,r.json);setSync('ok','Synced');return true}}
 catch(e){setSync('err','Download failed')}return false}

/* ===== TEMPLATES ===== */
/* mk(rows, opts): rows = 2D array; "=..." are formulas. opts: h header rows[], cur/pct column idx[], fmt {id:fmt}, b bold rows[], w widths */
function mk(rows,o){o=o||{};const sh=skeleton(),H=o.h||[0];
 rows.forEach((row,r)=>row.forEach((v,c)=>{if(v===''||v==null)return;const id=L(c)+(r+1),f={};
  if(H.includes(r)){f.bold=true;f.bg='#2b3a6b'}else{
   if((o.cur||[]).includes(c))f.numFmt='currency';if((o.pct||[]).includes(c))f.numFmt='percent';
   if(o.fmt&&o.fmt[id])f.numFmt=o.fmt[id]}
  if((o.b||[]).includes(r))f.bold=true;if(o.title&&r===0&&c===0){f.bold=true;f.fontSize=20;f.fontFamily="'Syne',sans-serif"}
  sh.data[id]={v:String(v),f}}));
 sh.colWidths=o.w||{};return sh}

const TEMPLATES=[
 {id:'blank',name:'Blank spreadsheet',desc:'Start from scratch',cat:'All',color:'#8d93a8',build:()=>skeleton()},
 {id:'budget',name:'Budget tracker',desc:'Income vs. spend',cat:'Finance',color:'#6c8cff',build:()=>mk([
  ["Category","Budgeted (₹)","Actual (₹)","Difference"],["Rent",25000,25000,"=B2-C2"],["Groceries",8000,7250,"=B3-C3"],["Transport",3000,3400,"=B4-C4"],["Utilities",4000,3800,"=B5-C5"],["Savings",10000,10000,"=B6-C6"],
  [],["Total","=SUM(B2:B6)","=SUM(C2:C6)","=SUM(D2:D6)"]],{cur:[1,2,3],b:[7],w:{0:150,1:120,2:110,3:110}})},
 {id:'expense',name:'Expense log',desc:'Daily spending by category',cat:'Finance',color:'#ff7ac6',build:()=>mk([
  ["Date","Category","Description","Amount (₹)","Paid by"],["2025-01-02","Food","Lunch",320,"UPI"],["2025-01-03","Travel","Metro card",500,"Cash"],["2025-01-05","Bills","Electricity",1840,"UPI"],["2025-01-07","Shopping","Shoes",2499,"Card"],["2025-01-09","Food","Groceries",1260,"UPI"],
  [],["","","Total","=SUM(D2:D6)",""]],{cur:[3],b:[7],w:{0:100,1:110,2:170,3:110,4:90}})},
 {id:'invoice',name:'Invoice',desc:'Bill clients with GST',cat:'Finance',color:'#a78bfa',build:()=>mk([
  ["INVOICE"],[],["Bill to:","","","Invoice #:","INV-001"],["Client name","","","Date:","=TODAY()"],[],["Item","Qty","Rate (₹)","Amount"],

const CATS=['All','Finance','Business','Planning','Education'];let curCat='All';
function renderCats(){$('cats').innerHTML=CATS.map(c=>`<button class="cat${c===curCat?' on':''}" data-c="${c}">${c}</button>`).join('');
 $('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{curCat=b.dataset.c;renderCats();renderTemplates()})}
function renderTemplates(){
 const list=TEMPLATES.filter(t=>t.id==='blank'||curCat==='All'||t.cat===curCat);
 $('templates').innerHTML=list.map(t=>`<div class="tpl" data-t="${t.id}" style="--tc:${t.color}"><div class="thumb">${t.id==='blank'?'':`<span class="tag">${t.cat}</span>`}</div><div class="lbl">${t.name}<small>${t.desc}</small></div></div>`).join('');
 $('templates').querySelectorAll('.tpl').forEach(c=>c.onclick=()=>create(c.dataset.t))}
function create(tid){
 const t=TEMPLATES.find(x=>x.id===tid)||TEMPLATES[0],id=uid(),name=t.id==='blank'?"Untitled spreadsheet":t.name;
 localStorage.setItem(DOC_PREFIX+id,JSON.stringify({sheets:{Sheet1:t.build()},order:["Sheet1"],current:"Sheet1",filename:name}));
 const l=loadIndex(),now=Date.now();l.unshift({id,name,createdAt:now,updatedAt:now});saveIndex(l);pushDoc(id,name,now,now);
 location.href=`prosheet.html?id=${id}`}
$('newBlankBtn').onclick=()=>create('blank');

/* ===== RECENT ===== */
let view=localStorage.getItem(VIEW_KEY)||'grid';
function setView(v){view=v;localStorage.setItem(VIEW_KEY,v);$('vGrid').classList.toggle('on',v==='grid');$('vList').classList.toggle('on',v==='list');$('recentGrid').classList.toggle('list',v==='list')}
$('vGrid').onclick=()=>setView('grid');$('vList').onclick=()=>setView('list');$('sortSel').onchange=()=>renderRecent();
function renderRecent(){
 const f=$('searchInput').value.trim().toLowerCase(),all=loadIndex(),sort=$('sortSel').value;
 $('stTotal').textContent=all.length;$('stCloud').textContent=all.filter(d=>d.cloud).length;$('stWeek').textContent=all.filter(d=>Date.now()-d.updatedAt<6048e5).length;
 const list=all.filter(d=>!f||d.name.toLowerCase().includes(f)).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='created'?b.createdAt-a.createdAt:b.updatedAt-a.updatedAt);
 $('recentCount').textContent=list.length?`· ${list.length}`:'';
 const g=$('recentGrid');
 if(!list.length){g.innerHTML=`<div class="empty"><h3>${f?'No matches':'No spreadsheets yet'}</h3><p>${f?'Try a different search.':'Create a blank spreadsheet or pick a template above.'}</p></div>`;return}
 const cloud=`<svg viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.7A4.5 4.5 0 0 0 6.5 19h11z"/></svg>`;
 g.innerHTML=list.map(d=>`<div class="doc" data-id="${d.id}"><div class="thumb">${d.cloud?`<div class="cloud" title="Synced to Google Drive">${cloud}</div>`:''}</div>
  <div class="mbtn" data-menu="${d.id}"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></div>
  <div class="menu" id="menu-${d.id}"><div class="mi" data-act="rename" data-id="${d.id}">Rename</div><div class="mi" data-act="duplicate" data-id="${d.id}">Duplicate</div><div class="mi danger" data-act="delete" data-id="${d.id}">Delete</div></div>
  <div class="doc-info"><div class="doc-name">${esc(d.name)}</div><div class="doc-meta">${relTime(d.updatedAt)}</div></div></div>`).join('');
 g.querySelectorAll('.doc').forEach(card=>card.onclick=async e=>{
  if(e.target.closest('.mbtn,.menu'))return;const id=card.dataset.id;
  if(await ensureDoc(id))location.href=`prosheet.html?id=${id}`;else toast("Couldn't load this spreadsheet from the cloud")});
 g.querySelectorAll('.mbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=$('menu-'+b.dataset.menu),open=m.classList.contains('show');closeMenus();if(!open)m.classList.add('show')});
 g.querySelectorAll('.mi').forEach(m=>m.onclick=e=>{e.stopPropagation();doAct(m.dataset.act,m.dataset.id);closeMenus()})}
const closeMenus=()=>document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'));
document.addEventListener('click',closeMenus);
function doAct(a,id){const d=loadIndex().find(x=>x.id===id);if(!d)return;if(a==='rename')renameDlg(d);else if(a==='duplicate')dup(d);else delDlg(d)}
async function dup(doc){
 await ensureDoc(doc.id);const raw=localStorage.getItem(DOC_PREFIX+doc.id),nid=uid(),nn=doc.name+" (copy)";
 if(raw){const wb=JSON.parse(raw);wb.filename=nn;localStorage.setItem(DOC_PREFIX+nid,JSON.stringify(wb))}
 const l=loadIndex(),now=Date.now();l.unshift({id:nid,name:nn,createdAt:now,updatedAt:now});saveIndex(l);pushDoc(nid,nn,now,now);renderRecent();toast("Duplicated")}
function dlg(h){$('dialogBox').innerHTML=h;$('dialogOverlay').classList.add('show')}
const closeDlg=()=>$('dialogOverlay').classList.remove('show');
$('dialogOverlay').onclick=e=>{if(e.target.id==='dialogOverlay')closeDlg()};
function renameDlg(doc){
 dlg(`<h3>Rename spreadsheet</h3><input id="rIn" value="${esc(doc.name)}"><div class="dialog-actions"><button class="btn" id="dC">Cancel</button><button class="btn primary" id="dS">Save</button></div>`);
 const i=$('rIn');i.focus();i.select();$('dC').onclick=closeDlg;
 $('dS').onclick=()=>{const nn=i.value.trim()||"Untitled spreadsheet",l=loadIndex(),d=l.find(x=>x.id===doc.id),now=Date.now();
  if(d){d.name=nn;d.updatedAt=now;saveIndex(l)}
  const raw=localStorage.getItem(DOC_PREFIX+doc.id);if(raw){const wb=JSON.parse(raw);wb.filename=nn;localStorage.setItem(DOC_PREFIX+doc.id,JSON.stringify(wb))}
  pushDoc(doc.id,nn,d?d.createdAt:now,now);closeDlg();renderRecent()};
 i.onkeydown=e=>{if(e.key==='Enter')$('dS').click()}}
function delDlg(doc){
 dlg(`<h3>Delete "${esc(doc.name)}"?</h3><p style="font-size:12.5px;color:var(--dim);margin:0">This can't be undone.</p><div class="dialog-actions"><button class="btn" id="dC">Cancel</button><button class="btn" id="dD" style="color:var(--danger);border-color:#5a2e2e">Delete</button></div>`);
 $('dC').onclick=closeDlg;
 $('dD').onclick=()=>{saveIndex(loadIndex().filter(d=>d.id!==doc.id));localStorage.removeItem(DOC_PREFIX+doc.id);delCloud(doc.id);closeDlg();renderRecent();toast("Deleted")}}
$('searchInput').oninput=()=>renderRecent();

/* init */
setView(view);renderCats();renderTemplates();renderRecent();renderAuth();initAuth();
})();
</script>
